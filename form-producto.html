<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Producto - Lucy Fast Food</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-body">
    <header>
        <h1>Lucy Fast Food</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Inicio</a></li>
                <li>
                    <a href="productos.html">Productos</a>
                    <ul>
                        <li><a href="productos.html">Detalle</a></li>
                        <li><a href="form-producto.html">Agregar</a></li>
                    </ul>
                </li>
                <li>
                    <a href="ventas.html">Ventas</a>
                    <ul>
                        <li><a href="ventas.html">Detalle</a></li>
                        <li><a href="form-venta.html">Registrar</a></li>
                    </ul>
                </li>
                <li class="nav-login"><a href="login.html">Login</a></li>
            </ul>
        </nav>
   </header>

    <main class="form-page">
        <section class="form-card">
            <div class="form-heading">
                <span class="form-eyebrow">Catálogo</span>
                <h2>Registrar Nuevo Producto</h2>
                <p>Completa los datos para agregar un producto al menú.</p>
            </div>
            <form class="data-form">
                <div class="field-group">
                    <label for="nombre">Nombre del producto:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Hamburguesa clásica" required>
                </div>

                <div class="field-group">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="0.00" required>
                </div>

                <div class="field-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria">
                <option value="hamburguesa">Hamburguesa</option>
                <option value="pizza">Pizza</option>
                <option value="bebida">Bebida</option>
                <option value="acompanamiento">Acompañamiento</option>
                    </select>
                </div>

                <button type="submit">Guardar Producto</button>
            </form>
        </section>
    </main>

    <footer>
        <p>2026 - Lucy Fast Food</p>
    </footer>
</body>
</html>
