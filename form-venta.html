<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta - Lucy Fast Food</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-body">
    <header>
        <h1>Lucy Fast Food</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Inicio</a></li>
                <li>
                    <a href="productos.html">Productos</a>
                    <ul>
                        <li><a href="productos.html">Detalle</a></li>
                        <li><a href="form-producto.html">Agregar</a></li>
                    </ul>
                </li>
                <li>
                    <a href="ventas.html">Ventas</a>
                    <ul>
                        <li><a href="ventas.html">Detalle</a></li>
                        <li><a href="form-venta.html">Registrar</a></li>
                    </ul>
                </li>
                <li class="nav-login"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-card">
            <div class="form-heading">
                <span class="form-eyebrow">Operaciones</span>
                <h2>Registrar Nueva Venta</h2>
                <p>Registra rápidamente los productos vendidos.</p>
            </div>
            <form class="data-form">
                <div class="field-group">
                    <label for="producto">Producto:</label>
                    <select id="producto" name="producto">
                <option value="hamburguesa">Hamburguesa Clasica</option>
                <option value="papas">Papas Fritas</option>
                <option value="refresco">Refresco</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" placeholder="1" required>
                </div>

                <div class="field-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <button type="submit">Guardar Venta</button>
            </form>
        </section>
    </main>

    <footer>
        <p>2026 - Lucy Fast Food</p>
    </footer>
</body>
</html>
